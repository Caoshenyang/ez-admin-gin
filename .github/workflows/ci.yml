name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'enterprise-foundation-v2']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 后端 ───
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy — run 'go mod tidy' and commit the changes"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -timeout 60s

      - name: Contract tests (OpenAPI)
        run: go test -v -timeout 60s ./tests/contract/...

  # ─── 集成测试 ───
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ez_admin
          POSTGRES_PASSWORD: ez_admin_123456
          POSTGRES_DB: ez_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ez_admin -d ez_admin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run integration tests
        env:
          EZ_DATABASE_NAME: ez_admin_test
          EZ_REDIS_DB: 1
        run: go test -tags integration -v -p 1 -timeout 180s ./tests/api/... ./tests/rbac/...

  # ─── 前端 ───
  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API types in sync
        run: |
          pnpm generate:api
          if ! git diff --exit-code src/api/generated.ts; then
            echo "::error::Generated API types are out of sync — run 'pnpm generate:api' in admin/ and commit"
            exit 1
          fi

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # ─── Docker Compose 校验 ───
  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.local.yml
        run: docker compose -f deploy/compose.local.yml config --quiet

      - name: Validate compose.prod.yml
        env:
          EZ_AUTH_JWT_SECRET: ci-placeholder
        run: docker compose -f deploy/compose.prod.yml config --quiet

      - name: Validate compose.server.yml
        run: docker compose -f deploy/compose.server.yml config --quiet

  # ─── 安全扫描 ───
  security-basic:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Go vulnerability check
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run govulncheck
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true
