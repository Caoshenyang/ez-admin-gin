<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EZ Admin Gin Brand Assets Preview</title>
  <style>
    :root { font-family: Inter, 'Inter Display', 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; color: #0D1B2A; background: #f8fafc; }
    body { margin: 0; padding: 40px; }
    h1 { font-size: 34px; margin: 0 0 8px; }
    p { color: #475569; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 18px; margin-top: 28px; }
    .card { background: white; border: 1px solid #E2E8F0; border-radius: 20px; padding: 24px; min-height: 180px; display: flex; flex-direction: column; gap: 16px; justify-content: center; align-items: center; }
    .card.dark { background: #0D1B2A; }
    .label { font-size: 13px; color: #475569; }
    .dark .label { color: #cbd5e1; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>EZ Admin Gin Brand Assets</h1>
  <p>SVG、PNG、ICO、favicon、app icon、social card 与开发 token 已导出。</p>
  <div class="grid">
    <div class="card"><img src="../svg/logo-horizontal.svg" /><div class="label">Horizontal SVG</div></div>
    <div class="card"><img src="../svg/logo-stacked.svg" style="width:220px" /><div class="label">Stacked SVG</div></div>
    <div class="card"><img src="../svg/logo-mark.svg" style="width:160px" /><div class="label">Logo Mark SVG</div></div>
    <div class="card dark"><img src="../svg/logo-mark-white.svg" style="width:160px" /><div class="label">White Mark</div></div>
    <div class="card"><img src="../png/app-icons/app-icon-256.png" style="width:160px" /><div class="label">App Icon 256</div></div>
    <div class="card"><img src="../svg/readme-badge.svg" /><div class="label">README Badge</div></div>
    <div class="card"><img src="../png/social/open-graph-light.png" /><div class="label">Open Graph Light</div></div>
    <div class="card dark"><img src="../png/social/open-graph-dark.png" /><div class="label">Open Graph Dark</div></div>
  </div>
</body>
</html>
